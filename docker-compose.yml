services:
  db:
    image: postgres:16-alpine
    container_name: agenda_eventos_db
    environment:
      POSTGRES_DB: agenda_eventos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenda_eventos"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: agenda_eventos_backend
    environment:
      PORT: "3000"
      LOG_LEVEL: "info"
      JWT_SECRET: "mude_isto_em_producao"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/agenda_eventos?schema=public"
      # Seed Configuration
      SEED_EMPRESA_NOME: "Empresa ADM Padrão"
      SEED_ADMIN_EMAIL: "admin@local.com"
      SEED_ADMIN_PASSWORD: "Admin123"
      SEED_INVITE_CODE: "MASTER-1234"
      SEED_INVITE_EXPIRES_AT: "2099-01-01T00:00:00.000Z"
      # Fake Data Configuration
      ENABLE_FAKE_DATA: "true"
      FAKE_DATA_VOLUME: "500"
    volumes:
      - ./Backend/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    container_name: agenda_eventos_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  db_data:
